[package]
name = "twist-compiler-napi"
version = "0.5.0-beta.0"
description = "Twist's compile pass for Node, Bun and Vite (a napi addon)."
edition.workspace = true
license.workspace = true
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
twist-compiler = { path = "../compiler" }
napi = { version = "3", default-features = false, features = ["napi4"] }
napi-derive = "3"

[build-dependencies]
napi-build = "2"
